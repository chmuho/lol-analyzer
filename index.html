<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LoL Search Ultimate Pro</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #010a13;
      color: #f0e6d2;
      font-family: 'Malgun Gothic', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      overflow-x: hidden;
      padding: 70px 20px 120px;
    }

    .container { display: flex; flex-direction: column; align-items: center; width: 100%; max-width: 1180px; }
    h1 { font-size: 2.8rem; color: #f0e6d2; margin-bottom: 10px; letter-spacing: 1px; text-align: center; }
    .sub-title { color: #a09480; font-size: 1.1rem; margin-bottom: 35px; text-align: center; }

    .search-area { margin-bottom: 40px; display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
    input { padding: 15px; background: #1e2328; border: 1px solid #3c3c41; color: #f0e6d2; border-radius: 4px; font-size: 1rem; width: 220px; transition: 0.3s; outline: none; }
    input:focus { border-color: #c8aa6e; box-shadow: 0 0 10px rgba(200, 170, 110, 0.3); }
    button { padding: 15px 35px; background: #c8aa6e; color: #010a13; border: none; font-weight: bold; cursor: pointer; font-size: 1rem; transition: 0.3s; }
    button:hover { background: #f0e6d2; }

    #card-view { width: min(100%, 1040px); display: none; justify-content: center; margin-top: 10px; margin-bottom: 120px; }
    .card {
      width: 100%;
      background: #1a1f2e;
      border: 2px solid #3c3c41;
      border-radius: 15px;
      padding: 36px 36px 52px;
      position: relative;
      opacity: 0;
      transform: translateX(100px);
      transition: all 0.6s cubic-bezier(0.23, 1, 0.32, 1);
    }
    .card.active { opacity: 1; transform: translateX(0); }
    .card.slide-out { opacity: 0; transform: translateX(-100px); }

    .theme-CHALLENGER { border-color: #f4c874; box-shadow: 0 0 30px rgba(244, 200, 116, 0.3); }
    .theme-GRANDMASTER { border-color: #e23b2c; box-shadow: 0 0 30px rgba(226, 59, 44, 0.3); }
    .theme-MASTER { border-color: #9b4dff; box-shadow: 0 0 30px rgba(155, 77, 255, 0.3); }
    .theme-DIAMOND { border-color: #5765d1; box-shadow: 0 0 30px rgba(87, 101, 209, 0.3); }
    .theme-EMERALD { border-color: #00a86b; box-shadow: 0 0 30px rgba(0, 168, 107, 0.28); }
    .theme-PLATINUM { border-color: #4e9996; box-shadow: 0 0 30px rgba(78, 153, 150, 0.25); }
    .theme-GOLD { border-color: #c89b3c; box-shadow: 0 0 30px rgba(200, 155, 60, 0.28); }
    .theme-SILVER { border-color: #aeb6bf; box-shadow: 0 0 30px rgba(174, 182, 191, 0.22); }
    .theme-BRONZE { border-color: #b0784f; box-shadow: 0 0 30px rgba(176, 120, 79, 0.25); }
    .theme-IRON { border-color: #6f6f75; box-shadow: 0 0 30px rgba(111, 111, 117, 0.22); }
    .theme-UNRANKED { border-color: #3c3c41; box-shadow: 0 0 24px rgba(60, 60, 65, 0.2); }

    .profile { display: flex; align-items: center; gap: 20px; margin-bottom: 5px; width: 100%; }
    .profile-img { width: 90px; height: 90px; border-radius: 50%; border: 3px solid #c8aa6e; flex-shrink: 0; }
    .p-info { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; }
    .name-wrapper { display: flex; align-items: center; gap: 10px; width: 100%; }
    #pName { font-size: 1.8rem; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 0 1 auto; }

    .ingame-badge {
      background: #e23b2c;
      color: white;
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 0.7rem;
      font-weight: bold;
      animation: pulse 2s infinite;
      flex-shrink: 0;
    }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }

    .section-title { font-size: 0.8rem; color: #c8aa6e; margin: 30px 0 15px; border-bottom: 1px solid #3c3c41; padding-bottom: 5px; text-transform: uppercase; letter-spacing: 1.5px; }
    .match-row { display: flex; gap: 8px; }
    .match-box { flex: 1; padding: 12px 5px; border-radius: 8px; text-align: center; font-size: 0.75rem; border: 1px solid rgba(255,255,255,0.05); }
    .win-box { background: rgba(35, 160, 74, 0.12); border-color: #23a04a; }
    .loss-box { background: rgba(198, 50, 62, 0.12); border-color: #c6323e; }
    .match-box img { width: 32px; border-radius: 50%; margin-bottom: 5px; }
    .summary-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
    .summary-card { background: rgba(0,0,0,0.28); border: 1px solid #3c3c41; border-radius: 8px; padding: 14px; min-height: 86px; }
    .summary-label { color: #a09480; font-size: 0.75rem; margin-bottom: 8px; }
    .summary-value { color: #fff; font-size: 1.35rem; font-weight: bold; line-height: 1; }
    .summary-sub { color: #c8aa6e; font-size: 0.75rem; margin-top: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .rank-card { background: rgba(0,0,0,0.3); padding: 20px; border-radius: 12px; margin-top: 8px; display: flex; align-items: center; gap: 20px; }
    .tier-img { width: 60px; height: 60px; object-fit: contain; }
    .lp-bar-bg { width: 100%; height: 6px; background: #010a13; border-radius: 10px; margin-top: 10px; overflow: hidden; }
    .lp-bar-fill { height: 100%; background: #c8aa6e; transition: width 1s; }

    .most-row { display: flex; justify-content: space-between; text-align: center; margin-top: 10px; }
    #mosts { margin-bottom: 18px; }
    .most-item { width: 30%; position: relative; }
    .most-img { width: 65px; border-radius: 50%; border: 2px solid #3c3c41; margin-bottom: 8px; }
    .mastery-tag { position: absolute; top: -5px; left: 50%; transform: translateX(-50%); background: #c8aa6e; color: #010a13; font-size: 0.6rem; padding: 2px 6px; border-radius: 4px; font-weight: bold; }

    .current-game { display: none; }
    .power-panel { background: rgba(0,0,0,0.25); border: 1px solid #3c3c41; border-radius: 8px; padding: 16px; margin-bottom: 14px; }
    .power-head { display: flex; justify-content: space-between; gap: 12px; align-items: center; margin-bottom: 12px; }
    .power-title { color: #fff; font-weight: bold; }
    .advantage-pill { color: #010a13; background: #c8aa6e; border-radius: 4px; padding: 4px 8px; font-size: 0.75rem; font-weight: bold; white-space: nowrap; }
    .power-bar { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); height: 10px; border-radius: 999px; overflow: hidden; background: #010a13; margin-bottom: 12px; }
    .power-blue { background: #2f80ed; }
    .power-red { background: #c6323e; }
    .power-stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .power-stat { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; color: #a09480; font-size: 0.78rem; }
    .power-stat b { color: #f0e6d2; }

    .team-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
    .team-panel { background: rgba(0,0,0,0.25); border: 1px solid #3c3c41; border-radius: 8px; overflow: hidden; }
    .team-header { display: flex; justify-content: space-between; align-items: center; padding: 12px 14px; background: rgba(200,170,110,0.08); color: #fff; font-weight: bold; }
    .team-header small { color: #a09480; font-weight: normal; }
    .player-row { display: grid; grid-template-columns: 42px minmax(0, 1.25fr) minmax(92px, 0.75fr) minmax(90px, 0.75fr) 58px; gap: 10px; align-items: center; padding: 10px 12px; border-top: 1px solid rgba(255,255,255,0.06); font-size: 0.78rem; }
    .player-row.searched { background: rgba(200,170,110,0.12); }
    .champ-icon { width: 38px; height: 38px; border-radius: 50%; border: 1px solid #3c3c41; object-fit: cover; }
    .player-name, .champ-name, .rank-text, .most-text { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .player-name { color: #fff; font-weight: bold; }
    .champ-name, .rank-sub, .most-sub, .threat-reason { color: #a09480; margin-top: 2px; }
    .rank-text { color: #f0e6d2; font-weight: bold; }
    .most-text { color: #c8aa6e; font-weight: bold; }
    .threat-cell { text-align: right; min-width: 0; }
    .threat-badge { display: inline-block; border-radius: 4px; padding: 4px 7px; font-size: 0.7rem; font-weight: bold; color: #010a13; }
    .threat-danger { background: #ff5c5c; }
    .threat-warn { background: #f4c874; }
    .threat-safe { background: #58c783; }
    .threat-reason { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 0.68rem; }
    .empty-live { color: #a09480; background: rgba(0,0,0,0.25); border: 1px solid #3c3c41; border-radius: 8px; padding: 16px; text-align: center; }

    @media (max-width: 920px) {
      body { padding: 40px 16px 110px; }
      h1 { font-size: 2.1rem; }
      .card { padding: 22px; }
      .team-grid, .power-stats, .summary-grid { grid-template-columns: 1fr; }
      .match-row { flex-wrap: wrap; }
      .match-box { min-width: 84px; }
      .most-row { gap: 8px; }
      .player-row { grid-template-columns: 42px minmax(0, 1fr) 58px; }
      .player-rank, .player-most { grid-column: 2 / 4; }
      .threat-cell { grid-column: 3; grid-row: 1; }
    }
  </style>
</head>
<body>
  <audio id="bgm" src="bgm.mp3" loop></audio>

  <div class="container">
    <h1>LOL SEARCH PRO</h1>
    <p class="sub-title">실시간 전적과 인게임 상태를 확인하세요</p>

    <div class="search-area">
      <input type="text" id="iName" placeholder="소환사명">
      <input type="text" id="iTag" placeholder="태그">
      <button onclick="performSlideSearch()">조회하기</button>
    </div>

    <div id="card-view">
      <div id="card" class="card">
        <div class="profile">
          <img id="pIcon" src="" class="profile-img" alt="">
          <div class="p-info">
            <div class="name-wrapper">
              <h2 id="pName"></h2>
              <div id="live" class="ingame-badge" style="display:none">LIVE</div>
            </div>
            <p id="pLevel" style="color:#a09480; font-size: 1.1rem; margin-top: 4px;"></p>
          </div>
        </div>

        <div id="gameAnalysis" class="current-game"></div>

        <div class="section-title">최근 20게임 요약</div>
        <div id="recentSummary" class="summary-grid"></div>
        <div class="section-title">최근 5경기 KDA</div>
        <div id="matches" class="match-row"></div>
        <div id="rankList"></div>
        <div class="section-title">모스트 챔피언</div>
        <div id="mosts" class="most-row"></div>
      </div>
    </div>
  </div>

  <script>
    let hasInteracted = false;
    const audio = document.getElementById('bgm');
    const API_BASE = location.protocol === 'file:' || location.port !== '3000' ? 'http://localhost:3000' : '';
    let ddragonVersion = '16.9.1';

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, ch => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#039;'
      }[ch]));
    }

    function championIcon(championId) {
      if (!championId) return '';
      return `https://ddragon.leagueoflegends.com/cdn/${ddragonVersion}/img/champion/${championId}.png`;
    }

    function hideBrokenImage(img) {
      img.style.visibility = 'hidden';
    }

    function rankLabel(rank) {
      if (!rank || rank.tier === 'UNRANKED') return 'UNRANKED';
      return `${rank.tier} ${rank.rank}`;
    }

    function renderPowerCompare(currentGame) {
      const blue = currentGame.teams.find(t => t.teamId === 100);
      const red = currentGame.teams.find(t => t.teamId === 200);
      const total = Math.max((blue?.summary.powerScore || 0) + (red?.summary.powerScore || 0), 1);
      const blueWidth = Math.max(8, Math.round(((blue?.summary.powerScore || 0) / total) * 100));
      const redWidth = Math.max(8, 100 - blueWidth);

      return `
        <div class="power-panel">
          <div class="power-head">
            <div class="power-title">팀 전력 비교</div>
            <div class="advantage-pill">${escapeHtml(currentGame.advantage?.label || '비슷함')}</div>
          </div>
          <div class="power-bar">
            <div class="power-blue" style="width:${blueWidth}%"></div>
            <div class="power-red" style="width:${redWidth}%"></div>
          </div>
          <div class="power-stats">
            ${renderTeamSummary(blue)}
            ${renderTeamSummary(red)}
          </div>
        </div>
      `;
    }

    function renderTeamSummary(team) {
      const s = team?.summary || {};
      return `
        <div class="power-stat">
          <b>${escapeHtml(team?.name || '-')}</b><span>전력 ${s.powerScore || 0}</span>
          <span>평균 승률 ${s.avgWinRate || 0}%</span><span>모스트 픽 ${s.mainPickCount || 0}명</span>
          <span>평균 티어 ${s.avgTierScore || 0}</span><span>고숙련 ${s.highMasteryCount || 0}명</span>
        </div>
      `;
    }

    function renderCurrentGame(currentGame, searchedName, searchedTag) {
      const wrap = document.getElementById('gameAnalysis');
      wrap.style.display = 'block';

      if (!currentGame || !Array.isArray(currentGame.teams)) {
        wrap.innerHTML = `
          <div class="section-title">현재 게임 분석</div>
          <div class="empty-live">${currentGame ? '서버를 새로 시작하면 현재 게임 상세 분석이 표시됩니다.' : '현재 진행 중인 게임이 없습니다.'}</div>
        `;
        return;
      }

      const normalizedSearch = `${searchedName}#${searchedTag}`.toLowerCase();
      const teamHtml = currentGame.teams.map(team => {
        const players = team.players.map(p => {
          const playerKey = `${p.name}#${p.tag}`.toLowerCase();
          const isSearched = playerKey === normalizedSearch;
          const most = p.mostChampion;
          const reasons = p.threat?.reasons?.length ? p.threat.reasons.join(', ') : '특이사항 없음';
          return `
            <div class="player-row ${isSearched ? 'searched' : ''}">
              <img class="champ-icon" src="${championIcon(p.champion?.id)}" onerror="hideBrokenImage(this)" alt="">
              <div>
                <div class="player-name">${escapeHtml(p.name)}${p.tag ? `#${escapeHtml(p.tag)}` : ''}</div>
                <div class="champ-name">${escapeHtml(p.champion?.name || '알 수 없음')}</div>
              </div>
              <div class="player-rank">
                <div class="rank-text">${escapeHtml(rankLabel(p.rank))}</div>
                <div class="rank-sub">승률 ${p.rank?.winRate || 0}% (${p.rank?.wins || 0}승 ${p.rank?.losses || 0}패)</div>
              </div>
              <div class="player-most">
                <div class="most-text">${most ? escapeHtml(most.name) : '모스트 없음'}</div>
                <div class="most-sub">${most ? `숙련도 ${most.level} · ${(most.points / 10000).toFixed(1)}만` : '-'}</div>
              </div>
              <div class="threat-cell">
                <span class="threat-badge threat-${escapeHtml(p.threat?.level || 'safe')}">${escapeHtml(p.threat?.label || '안정')}</span>
                <div class="threat-reason" title="${escapeHtml(reasons)}">${escapeHtml(reasons)}</div>
              </div>
            </div>
          `;
        }).join('');

        return `
          <div class="team-panel">
            <div class="team-header">
              <span>${escapeHtml(team.name)}</span>
              <small>전력 ${team.summary?.powerScore || 0} · 평균 승률 ${team.summary?.avgWinRate || 0}%</small>
            </div>
            ${players}
          </div>
        `;
      }).join('');

      wrap.innerHTML = `
        <div class="section-title">현재 게임 분석</div>
        ${renderPowerCompare(currentGame)}
        <div class="team-grid">${teamHtml}</div>
      `;
    }

    function renderRecentSummary(summary) {
      const wrap = document.getElementById('recentSummary');
      if (!summary || !summary.count) {
        wrap.innerHTML = '<div class="empty-live" style="grid-column:1/-1">최근 경기 정보가 없습니다.</div>';
        return;
      }

      const most = summary.mostPlayed;
      wrap.innerHTML = `
        <div class="summary-card">
          <div class="summary-label">최근 ${summary.count}게임 승률</div>
          <div class="summary-value">${summary.winRate}%</div>
          <div class="summary-sub">${summary.wins}승 ${summary.losses}패</div>
        </div>
        <div class="summary-card">
          <div class="summary-label">평균 KDA</div>
          <div class="summary-value">${summary.avgKda}</div>
          <div class="summary-sub">${summary.avgKills}/${summary.avgDeaths}/${summary.avgAssists}</div>
        </div>
        <div class="summary-card">
          <div class="summary-label">최근 폼</div>
          <div class="summary-value">${summary.winRate >= 60 ? '좋음' : summary.winRate >= 45 ? '보통' : '주의'}</div>
          <div class="summary-sub">${summary.winRate >= 60 ? '상승세입니다' : summary.winRate >= 45 ? '무난한 흐름입니다' : '최근 패배가 많습니다'}</div>
        </div>
        <div class="summary-card">
          <div class="summary-label">많이 한 챔피언</div>
          <div class="summary-value">${most ? escapeHtml(most.name) : '-'}</div>
          <div class="summary-sub">${most ? `${most.games}게임 · ${most.wins}승` : '정보 없음'}</div>
        </div>
      `;
    }

    async function performSlideSearch() {
      const view = document.getElementById('card-view');
      const card = document.getElementById('card');
      const name = document.getElementById('iName').value.trim();
      const tag = document.getElementById('iTag').value.trim();

      if (!name || !tag) return alert('소환사명과 태그를 입력해주세요!');

      if (!hasInteracted) {
        audio.volume = 0;
        audio.play().then(() => {
          hasInteracted = true;
          let vol = 0;
          const fadeIn = setInterval(() => {
            if (vol < 0.15) {
              vol += 0.01;
              audio.volume = vol;
            } else {
              clearInterval(fadeIn);
            }
          }, 100);
        }).catch(e => console.log(e));
      }

      view.style.display = 'flex';
      if (card.classList.contains('active')) {
        card.classList.remove('active');
        card.classList.add('slide-out');
        await new Promise(r => setTimeout(r, 450));
      }

      try {
        const res = await fetch(`${API_BASE}/api/summoner/${encodeURIComponent(name)}/${encodeURIComponent(tag)}`);
        const d = await res.json();
        if (!res.ok) throw new Error(d.error || 'Search failed');
        ddragonVersion = d.ddragonVersion || ddragonVersion;

        const solo = d.rank.find(r => r.queueType === 'RANKED_SOLO_5x5') || d.rank[0];
        card.className = `card theme-${solo?.tier || 'UNRANKED'}`;

        document.getElementById('live').style.display = d.currentGame ? 'inline-block' : 'none';
        document.getElementById('pIcon').src = d.iconUrl;
        document.getElementById('pName').innerText = `${d.name}#${d.tag}`;
        document.getElementById('pLevel').innerText = `Level ${d.level}`;

        renderCurrentGame(d.currentGame, d.name, d.tag);
        renderRecentSummary(d.recentSummary);

        document.getElementById('matches').innerHTML = d.lastGames.filter(Boolean).slice(0, 5).map(g => `
          <div class="match-box ${g.win ? 'win-box' : 'loss-box'}">
            <img src="${championIcon(g.champ?.id)}" onerror="hideBrokenImage(this)" alt=""><br>
            <b>${g.win ? '승리' : '패배'}</b><br>${g.k}/${g.d}/${g.a}
          </div>
        `).join('');

        const sortedRanks = [...d.rank].sort((a, b) => {
          if (a.queueType === 'RANKED_SOLO_5x5') return -1;
          if (b.queueType === 'RANKED_SOLO_5x5') return 1;
          if (a.queueType === 'RANKED_FLEX_SR') return -1;
          if (b.queueType === 'RANKED_FLEX_SR') return 1;
          return 0;
        });

        document.getElementById('rankList').innerHTML = sortedRanks.length ? sortedRanks.map(r => `
          <div class="section-title">${r.queueType.includes('SOLO') ? '솔로 랭크' : '자유 랭크'}</div>
          <div class="rank-card">
            <img class="tier-img" src="https://raw.communitydragon.org/latest/plugins/rcp-fe-lol-shared-components/global/default/${r.tier.toLowerCase()}.png" alt="">
            <div style="flex:1">
              <b style="font-size:1.1rem; color:#fff">${r.tier} ${r.rank}</b>
              <p style="color:#ccc">${r.leaguePoints} LP · ${r.wins}승 ${r.losses}패</p>
              <div class="lp-bar-bg"><div class="lp-bar-fill" style="width:${Math.min(r.leaguePoints, 100)}%"></div></div>
            </div>
          </div>
        `).join('') : '<div class="section-title">랭크</div><div class="empty-live">랭크 정보가 없습니다.</div>';

        document.getElementById('mosts').innerHTML = d.mostChampions.map(c => `
          <div class="most-item">
            <span class="mastery-tag">LV ${c.level}</span>
            <img class="most-img" src="${championIcon(c.id)}" onerror="hideBrokenImage(this)" alt=""><br>
            <b>${escapeHtml(c.name)}</b><br><small style="color:#a09480">${(c.points / 10000).toFixed(1)}만</small>
          </div>
        `).join('');

        setTimeout(() => {
          card.classList.remove('slide-out');
          card.classList.add('active');
        }, 50);
      } catch (e) {
        alert(`조회 실패: ${e.message}`);
      }
    }
  </script>
